<div class="container mt-5">

    <div class="card shodow-sm">
        <div class="card-header bg-primary text-white">
            Employees
        </div>
        <div class="card-body">
           

            <div >
           
            <label class="form-label"> Employee Name</label>
            <input type="text"
             class="form-control"
             placeholder="Enter Employee Name"
             value="Peter" 
                #employeeName>

                </div>


                <hr>
                
            <div >
           
            <label class="form-label"> Employee Email</label>
            <input type="email"
             class="form-control"
             placeholder="Enter Employee Email"
             value="Peter@gmail.com" 
                #employeeEmail>

                </div>

            <button class="btn btn-primary mt-3"
             (click)="ShowEmployee()">

                Show Employee

            </button> 

            |

             <button class="btn btn-secondary mt-3"
             (click)="ShowEmail()">

                Show Email

            </button>

            <p>
                {{employeeNameSt}}   ---- {{employeeEmailSt}}
            </p>

        </div>

    </div>

</div>




<div class="card shadow-sm mt-4">
  <div class="card-header bg-primary text-white">
    Employee List - ViewChildren
  </div>

  <div class="card-body">
    <div class="mb-2">
      <input #employees class="form-control" value="Madan">
    </div>

    <div class="mb-2">
      <input #employees class="form-control" value="John">
    </div>

    <div class="mb-2">
      <input #employees class="form-control" value="Robert">
    </div>

    <button class="btn btn-primary mt-2" (click)="showEmployees()">
      Show Employees
    </button>

  </div>
